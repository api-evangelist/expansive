aid: expansive
name: Expansive
description: >-
  Expansive is a Mexican real estate crowdfunding platform (crowdfunding inmobiliario) that lets
  individuals invest collectively in vetted real estate projects from as little as 1,000 MXN, earning
  returns backed by real guarantees. It operates as a regulated collective financing institution (IFC)
  under Mexico's Fintech Law and is supervised by the CNBV (Comisión Nacional Bancaria y de Valores).
  Expansive handles project vetting, funding, quarterly investor reporting, and payouts through its
  web platform and investor app (app.expansive.mx). The company is a portfolio company of 500 Global.
  It is a consumer-facing fintech investing product; it does not publish a public developer API,
  documentation, or SDK surface.
